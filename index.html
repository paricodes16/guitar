<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guitar lessons</title>
  <meta name="description" content="Learn guitar scales and triads on an interactive fretboard. Tap the notes to hear them.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
  <link rel="stylesheet" href="shared/style.css">
</head>
<body>
  <main class="page">
    <header class="head">
      <h1>Guitar lessons</h1>
      <p class="lede">Pick a lesson, tap the fretboard to hear each note, then practice playing it yourself.</p>
    </header>

    <section class="card" aria-label="Scales">
      <h2>Scales</h2>
      <ul class="scale-list">
        <li>
          <a class="scale-link" href="a-minor/">
            <strong>A minor</strong>
            <span>Position 1, frets 5 to 9</span>
          </a>
        </li>
      </ul>
    </section>

    <section class="card" aria-label="Chords">
      <h2>Chords</h2>
      <ul class="scale-list">
        <li>
          <a class="scale-link" href="triads/">
            <strong>Triads and inversions</strong>
            <span>Root position, 1st and 2nd inversion, starting from C major</span>
          </a>
        </li>
      </ul>
      <p class="more">More lessons will be added here.</p>
    </section>
  </main>
</body>
</html>
